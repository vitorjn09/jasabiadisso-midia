name: Publicar posts

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      modo:
        description: "publicar, verificar ou conexao"
        default: publicar

permissions:
  contents: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rodar o publicador
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          MODO: ${{ inputs.modo || 'publicar' }}
        run: |
          case "$MODO" in
            verificar) python publicador/publicar.py --verificar ;;
            conexao)   python publicador/publicar.py --conexao ;;
            *)         python publicador/publicar.py ;;
          esac

      - name: Guardar o resultado
        if: always()
        run: |
          git config user.name "publicador"
          git config user.email "publicador@users.noreply.github.com"
          git add agenda
          if ! git diff --cached --quiet; then
            git commit -m "Publicador: atualiza estado dos posts"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
